<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>徒步轨迹分享 · 敏感地点遮蔽</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>徒步轨迹分享</h1>
    <p>上传含时间的 GPX → 自动统计分段配速 → 在预览图上点击敏感地点并设定遮蔽半径 → 导出按遮蔽圆裁切、互不连接的 GPX 分段</p>
  </header>
  <main>
    <section class="panel">
      <h2>1. 上传 GPX</h2>
      <input type="file" id="file" accept=".gpx,application/gpx+xml">
      <div id="track-info" class="info muted">尚未上传轨迹</div>

      <h2>2. 设置遮蔽</h2>
      <p class="hint">在右侧预览图上<strong>点击</strong>即可在该位置添加遮蔽圆。</p>
      <label class="row">新圆半径（米）
        <input type="number" id="radius" value="200" min="1" max="100000" step="10">
      </label>
      <ul id="circle-list"></ul>
      <button id="clear-circles" class="secondary">清除全部遮蔽圆</button>

      <h2>3. 裁切结果</h2>
      <div id="stats" class="info muted">设置遮蔽后自动计算</div>
      <button id="download" disabled>下载遮蔽后的 GPX</button>
    </section>

    <section class="preview">
      <canvas id="map"></canvas>
      <div class="legend">
        <span><i class="sw original"></i>原始轨迹</span>
        <span><i class="sw visible"></i>可见轨迹</span>
        <span><i class="sw hidden"></i>被隐藏段</span>
        <span><i class="sw circle"></i>遮蔽圆</span>
      </div>
    </section>
  </main>

  <section class="pace">
    <h2>4. 分段配速</h2>
    <label class="row">每段里程（公里）
      <input type="number" id="split-km" value="1" min="0.1" max="10" step="0.1">
      <span class="hint">范围 0.1～10，默认 1；按原始 trkseg 分别累计球面距离，末尾不足一段也列出</span>
    </label>
    <div id="pace" class="info muted">上传含时间的 GPX 后自动计算</div>
  </section>

  <div id="message" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
